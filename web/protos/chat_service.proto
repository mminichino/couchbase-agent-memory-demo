syntax = "proto3";

package memory_demo.chat.v1;

service ChatService {
  rpc ProcessInput(ProcessInputRequest) returns (stream BaseMessageChunk);
  rpc GetModelInfo(GetModelInfoRequest) returns (ModelInfo);
}

message ProcessInputRequest {
  string content = 1;
  string session_id = 2;
  string user_id = 3;
}

message BaseMessageChunk {
  string message_json = 1;
  string audit_json = 2;
}

message GetModelInfoRequest {}

message ModelInfo {
  string llm_provider = 1;
  string llm_model = 2;
  string embedding_model = 3;
  string embedding_provider = 4;
}
