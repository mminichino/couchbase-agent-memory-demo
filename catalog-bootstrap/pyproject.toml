[project]
name = "agent-catalog-bootstrap"
version = "1.0.0"
description = "Bootstrap Couchbase Agent Catalog assets for the demo"
requires-python = ">=3.12"
dependencies = [
    "agentc[langchain]>=1.1.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
