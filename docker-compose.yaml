networks:
  agentmemory-network:
    driver: bridge

volumes:
  agentmemory-logs:
  agentmemory-prometheus:
  agentmemory-couchbase:
  agentmemory-web:
  agent-catalog-state:

services:
  bootstrap:
    image: mminichino/cbsbootstrap:0.5.0
    container_name: couchbase-bootstrap
    environment:
      - CBS_NODES=127.0.0.1
      - CBS_ALTERNATE_ADDRESS=couchbase-demo
      - CBS_BUCKET=ams
      - CBS_SCOPE=web
      - CBS_COLLECTION=session
      - CBS_IMPORT_KEYSPACE=travel.data.flights
    volumes:
      - ./data/flights.jsonl:/import/data.json
    networks:
      - agentmemory-network
    depends_on:
      couchbase:
        condition: service_started
    restart: no

  couchbase:
    image: couchbase/server:enterprise-8.0.2
    container_name: couchbase-demo
    ports:
      - "8091-8096:8091-8096"
      - "9123:9123"
      - "11207:11207"
      - "11210:11210"
      - "11280:11280"
      - "18091-18097:18091-18097"
    volumes:
      - agentmemory-couchbase:/opt/couchbase/var
    networks:
      - agentmemory-network
    restart: unless-stopped

  catalog-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    image: agent-catalog-bootstrap:latest
    container_name: agent-catalog-bootstrap
    environment:
      - AGENT_CATALOG_CONN_STRING=couchbase://couchbase-demo
      - AGENT_CATALOG_USERNAME=Administrator
      - AGENT_CATALOG_PASSWORD=password
      - AGENT_CATALOG_BUCKET=ams
      - AGENT_CATALOG_STATE_DIR=/workspace/agentc-state
      - AGENT_CATALOG_INTERACTIVE=False
      - CATALOG_GIT_URL=${CATALOG_GIT_URL:-https://github.com/mminichino/couchbase-agent-memory-demo.git}
      - CATALOG_GIT_REF=${CATALOG_GIT_REF:-main}
      - CATALOG_GIT_TOKEN=${CATALOG_GIT_TOKEN:-}
      - CB_CONN_STRING=couchbase://couchbase-demo
      - CB_USERNAME=Administrator
      - CB_PASSWORD=password
    volumes:
      - agent-catalog-state:/workspace/agentc-state
    networks:
      - agentmemory-network
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: "no"

  couchbase-agentmemory-server:
    image: agentmemory-server:v1.0.0
    container_name: agentmemory-server
    ports:
      - "${AGENTMEMORY_SERVER_PORT:-8080}:${AGENTMEMORY_SERVER_PORT:-8080}"
      - "9090:9090"
    environment:
      - AGENTMEMORY_CONN_STRING=couchbase://couchbase-demo
      - AGENTMEMORY_USERNAME=Administrator
      - AGENTMEMORY_PASSWORD=password
      - AGENTMEMORY_BUCKET=ams
      - AGENTMEMORY_MEMORY_BLOCK_TTL=0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AGENTMEMORY_LLM_API_KEY=${AGENTMEMORY_LLM_API_KEY:-}
      - AGENTMEMORY_LLM_URL=${AGENTMEMORY_LLM_URL:-}
      - AGENTMEMORY_LLM_MODEL=${AGENTMEMORY_LLM_MODEL:-gpt-5.4}
      - AGENTMEMORY_EMBEDDING_API_KEY=${AGENTMEMORY_EMBEDDING_API_KEY:-}
      - AGENTMEMORY_EMBEDDING_URL=${AGENTMEMORY_EMBEDDING_URL:-}
      - AGENTMEMORY_EMBEDDING_MODEL=${AGENTMEMORY_EMBEDDING_MODEL:-text-embedding-3-small}
      - AGENTMEMORY_EXTRACT_SEMANTIC=true
      - AGENTMEMORY_SUMMARY_TOKEN_LIMIT=700
      - AGENTMEMORY_PROCESSING_BATCH_SIZE=5
      - AGENTMEMORY_IDLE_SLEEP_SECONDS=0.2
      - AGENTMEMORY_MAX_CONCURRENT_TASKS=100
      - AGENTMEMORY_MAX_REQUESTS_PER_MINUTE=1500
      - AGENTMEMORY_MAX_TOKENS_PER_MINUTE=125000
      - AGENTMEMORY_PER_REQUEST_TOKEN_LIMIT=4096
      - AGENTMEMORY_QUEUE_MAX_SIZE=10000
      - AGENTMEMORY_MAX_FAIL_COUNT=3
      - AGENTMEMORY_TASK_TIMEOUT_SECONDS=300
      - AGENTMEMORY_SERVER_HOST=0.0.0.0
      - AGENTMEMORY_SERVER_PORT=8080
      - AGENTMEMORY_HEALTH_CACHE_TTL_SECONDS=60
      - AGENTMEMORY_HEALTH_REFRESH_INTERVAL_SECONDS=30
      - AGENTMEMORY_MEMORY_MONITOR=false
      - LOG_LEVEL=INFO
      - TIMESTAMPED_LOGS=true
      - LOG_MAX_BYTES=10485760
      - LOG_BACKUP_COUNT=10
      - OIDC_AUTH_ENABLED=false
    volumes:
      - agentmemory-logs:/app/logs
      - agentmemory-prometheus:/prometheus-data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.getenv('AGENTMEMORY_SERVER_PORT', '8080')}/health\").read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 60s
    networks:
      - agentmemory-network
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  couchbase-mcp-server:
    image: couchbase/mcp-server:1.0.0
    container_name: mcp-server
    ports:
      - "9001:9001"
    environment:
      - CB_CONNECTION_STRING=couchbase://couchbase-demo
      - CB_USERNAME=Administrator
      - CB_PASSWORD=password
      - CB_MCP_PORT=9001
      - CB_MCP_HOST=0.0.0.0
      - CB_MCP_TRANSPORT=http
    restart: unless-stopped
    networks:
      - agentmemory-network
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile.grpc
    image: agent-memory-demo-service:latest
    container_name: agent-memory-demo-service
    environment:
      - MCP_SERVER_URL=http://mcp-server:9001/mcp
      - AGENT_MEMORY_SERVER_URL=http://agentmemory-server:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AGENTMEMORY_LLM_API_KEY=${AGENTMEMORY_LLM_API_KEY:-}
      - AGENTMEMORY_LLM_MODEL=${AGENTMEMORY_LLM_MODEL:-}
      - AGENTMEMORY_LLM_URL=${AGENTMEMORY_LLM_URL:-}
      - AGENTMEMORY_EMBEDDING_MODEL=${AGENTMEMORY_EMBEDDING_MODEL:-}
      - AGENTMEMORY_EMBEDDING_URL=${AGENTMEMORY_EMBEDDING_URL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AGENT_CATALOG_CONN_STRING=couchbase://couchbase-demo
      - AGENT_CATALOG_USERNAME=Administrator
      - AGENT_CATALOG_PASSWORD=password
      - AGENT_CATALOG_BUCKET=ams
      - AGENT_CATALOG_CATALOG_PATH=/app/agentc-state/.agent-catalog
      - AGENT_CATALOG_ACTIVITY_PATH=/app/agentc-state/.agent-activity
      - CB_CONN_STRING=couchbase://couchbase-demo
      - CB_USERNAME=Administrator
      - CB_PASSWORD=password
    volumes:
      - agent-catalog-state:/app/agentc-state
    depends_on:
      catalog-bootstrap:
        condition: service_completed_successfully
      couchbase-agentmemory-server:
        condition: service_started
    ports:
      - "8088:8088"
    restart: unless-stopped
    networks:
      - agentmemory-network

  web-server:
    build:
      context: web
      dockerfile: Dockerfile
    image: agent-memory-demo-web:latest
    container_name: agent-memory-demo-web
    environment:
      - COUCHBASE_CONNECTION_STRING=couchbase://couchbase-demo
      - COUCHBASE_USERNAME=Administrator
      - COUCHBASE_PASSWORD=password
      - COUCHBASE_BUCKET=ams
      - COUCHBASE_SCOPE=web
      - COUCHBASE_COLLECTION=session
      - CHAT_API_URL=http://grpc-server:8088
    depends_on:
      - couchbase
      - grpc-server
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - agentmemory-network
