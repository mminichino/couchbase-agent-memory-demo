[project]
name = "couchbase-agent-memory-demo"
dynamic = ["version"]
description = "Couchbase Agent Memory Server Demo"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80.0",
    "protobuf>=5.0.0",
    "gradio>=6.9.0",
    "dotenv>=0.9.9",
    "openai>=2.26.0",
    "couchbase-agent-memory>=1.0.0",
    "langchain>=1.2.10",
    "langchain_core>=1.2.17",
    "langchain_openai>=1.1.10",
    "langchain-tavily>=0.2.17",
    "tavily-python>=0.7.23",
    "typer>=0.12.0",
    "langchain-mcp-adapters>=0.3.0",
    "agentc[langchain]>=1.1.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.2.0",
]

[project.urls]
"Homepage" = "https://github.com/mminichino/couchbase-agent-memory-demo/tree/master/src"

[project.scripts]
memory_demo_grpc = "memory_demo.grpc_chat:main"
memory_exercise = "memory_demo.memory_exercise:app"

[dependency-groups]
test = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-rerunfailures>=10.3",
    "pytest-mock>=3.6.1",
]
dev = [
    "grpcio-tools>=1.80.0",
    "hatch",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/memory_demo/__init__.py"

[tool.hatch.build.targets.sdist]
packages = ["src/memory_demo"]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_demo"]
