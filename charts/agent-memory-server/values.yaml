replicaCount: 1

image:
  repository: "agentmemory"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

port: 8080

model:
  llm: "gpt-5.4"
  embedding: "text-embedding-3-small"
  # Optional OpenAI-compatible base URLs.
  llmUrl: ""
  # When set, embeddings use this endpoint instead of built-in OpenAI.
  embeddingUrl: ""

couchbase:
  connectionString: "couchbase://couchbase.example.com"
  username: "Administrator"
  password: ""
  bucket: "ams"
  secretName: "couchbase-credentials"

memory:
  blockTtl: 0
  extractSemantic: true
  summaryTokenLimit: 700

processing:
  batchSize: 5
  idleSleepSeconds: 0.2
  maxConcurrentTasks: 100
  maxRequestsPerMinute: 1500
  maxTokensPerMinute: 125000
  perRequestTokenLimit: 4096
  queueMaxSize: 10000
  maxFailCount: 3
  taskTimeoutSeconds: 300

# LLM: anthropic.enabled -> Claude via AGENTMEMORY_LLM_*; otherwise OpenAI.
# Embeddings: OpenAI by default, or model.embeddingUrl (+ openai secret as embedding key).
openai:
  secretName: openai-api-key-secret
  key: ""

anthropic:
  enabled: false
  secretName: anthropic-api-key-secret
  key: ""
  model: "claude-sonnet-5"
  llmUrl: "https://api.anthropic.com/v1/"

externalSecret:
  enabled: true
  store:
    kind: ClusterSecretStore
    name: "secret-store"
  keys:
    openai: "openai-api-key"
    anthropic: "anthropic-api-key"
    couchbaseUsername: "couchbase-username"
    couchbasePassword: "couchbase-password"
