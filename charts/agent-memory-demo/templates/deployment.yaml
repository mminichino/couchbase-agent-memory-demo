apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-memory-demo
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: agent-memory-demo
  template:
    metadata:
      labels:
        app: agent-memory-demo
    spec:
      containers:
        - name: agent-memory-demo-api
          image: "docker.io/mminichino/agent-memory-demo-api:{{ .Values.app.apiVersion }}"
          imagePullPolicy: Always
          env:
            - name: AGENT_MEMORY_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.url }}
                  key: AGENT_MEMORY_SERVER_URL
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.tavily }}
                  key: TAVILY_API_KEY
            {{- if .Values.llm.anthropicEnabled }}
            - name: AGENTMEMORY_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.anthropic }}
                  key: AGENTMEMORY_LLM_API_KEY
            - name: AGENTMEMORY_LLM_MODEL
              value: {{ .Values.llm.model | default "claude-sonnet-5" | quote }}
            - name: AGENTMEMORY_LLM_URL
              value: {{ .Values.llm.url | default "https://api.anthropic.com/v1/" | quote }}
            {{- else }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.openai }}
                  key: OPENAI_API_KEY
            {{- if .Values.llm.model }}
            - name: AGENTMEMORY_LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            {{- end }}
            {{- if .Values.llm.url }}
            - name: AGENTMEMORY_LLM_URL
              value: {{ .Values.llm.url | quote }}
            {{- end }}
            {{- end }}
            - name: AGENTMEMORY_EMBEDDING_MODEL
              value: {{ .Values.embedding.model | quote }}
            {{- if .Values.embedding.url }}
            - name: AGENTMEMORY_EMBEDDING_URL
              value: {{ .Values.embedding.url | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8088
              protocol: TCP
        - name: agent-memory-demo-web
          image: "docker.io/mminichino/agent-memory-demo-web:{{ .Values.app.webVersion }}"
          imagePullPolicy: Always
          env:
            - name: COUCHBASE_CONNECTION_STRING
              value: {{ .Values.couchbase.connectionString | quote }}
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: COUCHBASE_USERNAME
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.couchbase.secretName }}
                  key: COUCHBASE_PASSWORD
            - name: COUCHBASE_BUCKET
              value: {{ .Values.couchbase.bucket | quote }}
            - name: COUCHBASE_SCOPE
              value: {{ .Values.couchbase.scope | quote }}
            - name: COUCHBASE_COLLECTION
              value: {{ .Values.couchbase.collection | quote }}
            - name: CHAT_API_URL
              value: "http://localhost:8088"
            - name: ADMIN_USER
              value: {{ .Values.app.username }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.password }}
                  key: password
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
