#

name: agent-memory-demo
service: agent-memory-demo
replicaCount: 1

couchbase:
  connectionString: "couchbase://couchbase.example.com"
  username: "Administrator"
  password: ""
  bucket: "ams"
  scope: "web"
  collection: "session"
  secretName: "couchbase-credentials"

server:
  service: "agent-memory-server"
  namespace: ""
  port: 8000

keys:
  openai: ""
  anthropic: ""
  tavily: ""

secrets:
  openai: "openai-api-key-demo-secret"
  anthropic: "anthropic-api-key-demo-secret"
  tavily: "tavily-api-key-demo-secret"
  password: "agent-memory-demo-password"
  url: "agent-memory-server-url"

# Prefer Claude when llm.anthropicEnabled is true (API container exposes GetModelInfo).
# Embeddings for AMS remain configured on the agent-memory-server chart; the demo
# API also receives embedding model/url for Session details via gRPC.
llm:
  anthropicEnabled: false
  # Used when anthropicEnabled is true (or as optional OpenAI overrides when set).
  model: ""
  url: ""

embedding:
  model: "text-embedding-3-small"
  url: ""

dns:
  domain: ""

ingress:
  enabled: true
  type: "haproxy"

app:
  username: "admin"
  password: "password"
  apiVersion: 0.3.0
  webVersion: 0.1.1
  couchbaseVersion: 8.0.2

tls:
  enabled: true
  secretName: agent-memory-demo-tls

externalSecret:
  enabled: true
  store:
    kind: ClusterSecretStore
    name: "secret-store"
  keys:
    openai: "openai-api-key"
    anthropic: "anthropic-api-key"
    tavily: "tavily-api-key"
    password: "demo-ui-password"
    couchbaseUsername: "couchbase-username"
    couchbasePassword: "couchbase-password"
